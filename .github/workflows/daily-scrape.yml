name: Daily Room Scrape

on:
  schedule:
    - cron: '0 13 * * *'  # 6 AM AZ time (13:00 UTC)
  workflow_dispatch:  # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL_ROOM: ${{ secrets.DISCORD_WEBHOOK_URL_ROOM }}
        run: python main.py
